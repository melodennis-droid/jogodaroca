<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rei da Roça</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(#2e4a1f, #1a2f12); color: #fff; min-height: 100vh; }
    
    .login-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1e2f1b; padding: 45px 35px; border-radius: 20px; width: 380px;
      text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.9); z-index: 1000;
    }
    h1 { color: #ffcc00; font-size: 32px; margin-bottom: 8px; }
    h2 { color: #ccc; margin-bottom: 25px; font-size: 20px; }
    input { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; }
    button { background: #ffcc00; color: black; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
    .toggle { color: #ffcc00; margin-top: 20px; cursor: pointer; font-size: 15px; }

    .game-container { display: none; }
    header { background: #0f1a0a; padding: 20px; font-size: 32px; font-weight: bold; border-bottom: 5px solid #ffcc00; text-align: center; }
    .resources { background: rgba(0,0,0,0.6); padding: 18px; font-size: 24px; display: flex; justify-content: center; gap: 50px; flex-wrap: wrap; }
    .game { display: flex; max-width: 1200px; margin: 30px auto; gap: 25px; padding: 0 20px; }
    .farm { flex: 2; background: #3a5f2f; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; }
    #plant { width: 280px; height: 280px; margin: 20px auto; font-size: 120px; line-height: 280px; cursor: pointer; transition: all 0.1s; user-select: none; }
    #plant:active { transform: scale(0.85); }
    .shop { flex: 1; background: #1e2f1b; border-radius: 20px; padding: 25px; text-align: left; }
    .upgrade { background: #2e4728; margin: 12px 0; padding: 16px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .upgrade:hover { background: #4a7043; transform: translateX(10px); }
    .upgrade.nao-pode { opacity: 0.5; cursor: not-allowed; }
    #statusSalvar { font-size: 13px; color: #aaa; text-align: center; padding: 5px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-box">
    <h1>🌱 REI DA ROÇA</h1>
    <h2 id="titulo">Entrar na Conta</h2>
    
    <input type="text" id="username" placeholder="Nome de usuário" />
    <input type="password" id="password" placeholder="Senha" />
    
    <button id="btnAcao" onclick="fazerLogin()">Entrar</button>
    <div class="toggle" onclick="toggleModo()">Criar Nova Conta</div>
    
    <p id="mensagem" style="margin-top: 15px; min-height: 24px;"></p>
  </div>

  <!-- JOGO -->
  <div id="gameContainer" class="game-container">
    <header>🌱 REI DA ROÇA - <span id="nomeJogador"></span> 🌾</header>

    <div class="resources">
      <div><strong>🌿 Mandioca:</strong> <span id="mandioca">0</span></div>
      <div><strong>💰 Dinheiro:</strong> R$ <span id="dinheiro">0</span></div>
      <div><strong>⚡ Por segundo:</strong> <span id="pps">0.0</span></div>
    </div>
    <div id="statusSalvar">💾 Progresso salvo</div>

    <div class="game">
      <div class="farm">
        <h2>Sua Roça</h2>
        <div id="plant" onclick="colher()">🌿</div>
        <p>Clique na mandioca para colher!</p>
        <br>
        <button onclick="vender()" style="font-size:16px;">Vender 10 Mandiocas (R$ 8)</button>
      </div>

      <div class="shop">
        <h2>🏪 Loja do Interior</h2>
        <div id="shop"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAfobSZ9vgLyWkK3olmUwGq0gvkbDgBcCc",
      authDomain: "rei-da-roca.firebaseapp.com",
      projectId: "rei-da-roca",
      storageBucket: "rei-da-roca.firebasestorage.app",
      messagingSenderId: "207534518922",
      appId: "1:207534518922:web:21d94302946e1a4b867373"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let usuarioAtual = null;
    let nomeAtual = "";
    let mandioca = 0, dinheiro = 0, pps = 0;
    let modoLogin = true; // true = login, false = cadastro

    const upgrades = [
      {id:1, nome:"🌱 Mais Pés de Mandioca", preco:25,  inc:2,   qtd:0},
      {id:2, nome:"⛏️ Enxada Melhorada",     preco:80,  inc:6,   qtd:0},
      {id:3, nome:"💧 Irrigação",             preco:200, inc:15,  qtd:0},
      {id:4, nome:"🚜 Trator",               preco:550, inc:40,  qtd:0},
      {id:5, nome:"👨‍🌾 Peão",                preco:950, inc:70,  qtd:0},
      {id:6, nome:"🚛 Caminhão",             preco:2500, inc:180, qtd:0},
      {id:7, nome:"🐔 Galinheiro",           preco:4200, inc:320, qtd:0}
    ];

    // ==================== AUTH ====================

    async function fazerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("mensagem");

      if (!username || !password) {
        mostrarMsg("Preencha todos os campos!", "red"); return;
      }
      mostrarMsg("Entrando...", "#ffcc00");

      try {
        const userCred = await auth.signInWithEmailAndPassword(username + "@reidaroca.com", password);
        usuarioAtual = userCred.user.uid;
        nomeAtual = username;
        await iniciarJogo();
      } catch (e) {
        mostrarMsg("Usuário ou senha incorretos!", "red");
      }
    }

    async function cadastrarConta() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("mensagem");

      if (!username || !password) {
        mostrarMsg("Preencha todos os campos!", "red"); return;
      }
      if (password.length < 6) {
        mostrarMsg("Senha precisa ter pelo menos 6 caracteres!", "red"); return;
      }
      mostrarMsg("Criando conta...", "#ffcc00");

      try {
        const userCred = await auth.createUserWithEmailAndPassword(username + "@reidaroca.com", password);
        usuarioAtual = userCred.user.uid;
        nomeAtual = username;

        // Cria documento inicial usando set() (cria se não existir)
        await db.collection("jogadores").doc(usuarioAtual).set({
          username: username,
          mandioca: 0,
          dinheiro: 0,
          pps: 0,
          upgrades: {} // objeto chave=id, valor=qtd
        });

        mostrarMsg("Conta criada! Entrando...", "lime");
        setTimeout(async () => await iniciarJogo(), 1000);
      } catch (e) {
        mostrarMsg("Erro: " + traduzirErro(e.code), "red");
      }
    }

    function toggleModo() {
      modoLogin = !modoLogin;
      document.getElementById("titulo").textContent = modoLogin ? "Entrar na Conta" : "Criar Nova Conta";
      document.getElementById("btnAcao").textContent = modoLogin ? "Entrar" : "Cadastrar";
      document.getElementById("btnAcao").setAttribute("onclick", modoLogin ? "fazerLogin()" : "cadastrarConta()");
      document.querySelector(".toggle").textContent = modoLogin ? "Criar Nova Conta" : "Já tenho conta";
      document.getElementById("mensagem").textContent = "";
    }

    function mostrarMsg(texto, cor) {
      const m = document.getElementById("mensagem");
      m.style.color = cor;
      m.textContent = texto;
    }

    function traduzirErro(code) {
      const erros = {
        "auth/email-already-in-use": "Nome de usuário já existe!",
        "auth/weak-password": "Senha muito fraca (mínimo 6 caracteres)",
        "auth/invalid-email": "Nome de usuário inválido"
      };
      return erros[code] || "Erro desconhecido";
    }

    // ==================== JOGO ====================

    async function iniciarJogo() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("gameContainer").style.display = "block";
      document.getElementById("nomeJogador").textContent = nomeAtual;
      await carregarProgresso();
    }

    // ==================== SALVAMENTO ====================

    async function carregarProgresso() {
      try {
        const doc = await db.collection("jogadores").doc(usuarioAtual).get();

        if (!doc.exists) {
          // Documento não existe, cria um novo
          await db.collection("jogadores").doc(usuarioAtual).set({
            username: nomeAtual,
            mandioca: 0, dinheiro: 0, pps: 0, upgrades: {}
          });
          atualizar();
          return;
        }

        const data = doc.data();
        mandioca = data.mandioca || 0;
        dinheiro = data.dinheiro || 0;

        // Carrega upgrades por ID (robusto, não depende de ordem)
        const upgradesSalvos = data.upgrades || {};
        upgrades.forEach(up => {
          // Suporta tanto formato antigo (array) quanto novo (objeto)
          if (Array.isArray(upgradesSalvos)) {
            const encontrado = upgradesSalvos.find(u => u.id === up.id);
            up.qtd = encontrado ? (encontrado.qtd || 0) : 0;
          } else {
            up.qtd = upgradesSalvos[up.id] || 0;
          }
        });

        // Recalcula PPS a partir dos upgrades (evita inconsistência)
        pps = upgrades.reduce((total, up) => total + up.inc * up.qtd, 0);

        atualizarStatus("✅ Progresso carregado!");
        atualizar();

      } catch (e) {
        console.error("Erro ao carregar:", e);
        atualizarStatus("⚠️ Erro ao carregar progresso");
      }
    }

    async function salvarProgresso() {
      if (!usuarioAtual) return;

      // Monta objeto de upgrades por ID (mais robusto que array)
      const upgradesObj = {};
      upgrades.forEach(up => { upgradesObj[up.id] = up.qtd; });

      const dados = {
        mandioca: Math.floor(mandioca),
        dinheiro: Math.floor(dinheiro),
        pps: pps,
        upgrades: upgradesObj,
        ultimoSalvo: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        // set com merge: cria se não existir, atualiza se existir
        await db.collection("jogadores").doc(usuarioAtual).set(dados, { merge: true });
        atualizarStatus("💾 Salvo às " + new Date().toLocaleTimeString('pt-BR'));
      } catch (e) {
        console.error("Erro ao salvar:", e);
        atualizarStatus("⚠️ Falha ao salvar: " + e.message);
      }
    }

    function atualizarStatus(msg) {
      document.getElementById("statusSalvar").textContent = msg;
    }

    // ==================== LÓGICA DO JOGO ====================

    function atualizar() {
      document.getElementById("mandioca").textContent = Math.floor(mandioca);
      document.getElementById("dinheiro").textContent = Math.floor(dinheiro);
      document.getElementById("pps").textContent = pps.toFixed(1);
      renderShop();
    }

    function colher() {
      mandioca += 1;
      atualizar();
    }

    function vender() {
      if (mandioca >= 10) {
        mandioca -= 10;
        dinheiro += 8;
        atualizar();
      } else {
        atualizarStatus("⚠️ Precisa de pelo menos 10 mandiocas!");
      }
    }

    function comprar(id) {
      const up = upgrades.find(u => u.id === id);
      const preco = Math.floor(up.preco * Math.pow(1.18, up.qtd));
      if (dinheiro >= preco) {
        dinheiro -= preco;
        up.qtd++;
        pps += up.inc;
        atualizar();
        salvarProgresso();
      }
    }

    function renderShop() {
      let html = "";
      upgrades.forEach(up => {
        const preco = Math.floor(up.preco * Math.pow(1.18, up.qtd));
        const podePagar = dinheiro >= preco;
        html += `
          <div class="upgrade ${podePagar ? '' : 'nao-pode'}" onclick="comprar(${up.id})">
            <strong>${up.nome}</strong> <span style="color:#aaa">(${up.qtd}x)</span><br>
            <span style="color:#ffcc00">R$ ${preco}</span>
            <span style="color:#88cc88; font-size:13px"> +${up.inc}/s cada</span>
          </div>`;
      });
      document.getElementById("shop").innerHTML = html;
    }

    // Auto save a cada 5 segundos
    setInterval(salvarProgresso, 5000);

    // Tick do jogo a cada 100ms (10x por segundo)
    setInterval(() => {
      if (usuarioAtual) {
        mandioca += pps / 10;
        atualizar();
      }
    }, 100);

    // Salva ao fechar/sair da aba
    window.addEventListener("beforeunload", () => salvarProgresso());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) salvarProgresso();
    });
  </script>
</body>
</html>
