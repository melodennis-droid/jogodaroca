
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#game{width:100%;min-height:600px;background:#0a0a0a;color:#fff;position:relative;overflow:hidden;border-radius:var(--border-radius-lg)}
canvas{display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a}
.hidden{display:none!important}
.title{font-size:2.5rem;font-weight:500;color:#e63946;letter-spacing:2px;margin-bottom:.5rem}
.subtitle{font-size:1rem;color:#aaa;margin-bottom:2rem}
.btn{background:transparent;border:1.5px solid #e63946;color:#e63946;padding:10px 32px;border-radius:var(--border-radius-md);font-size:1rem;cursor:pointer;margin:6px;transition:background .2s,color .2s}
.btn:hover{background:#e63946;color:#fff}
.btn-green{border-color:#4caf50;color:#4caf50}
.btn-green:hover{background:#4caf50;color:#fff}
.btn-gray{border-color:#666;color:#aaa}
.btn-gray:hover{background:#333;color:#fff}
input[type=text]{background:#111;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:var(--border-radius-md);font-size:1rem;width:240px;margin-bottom:12px;outline:none}
input[type=text]:focus{border-color:#e63946}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(0,0,0,.7);font-size:14px;z-index:10}
.hud-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.hud-label{font-size:10px;color:#888;letter-spacing:1px}
.hud-val{font-size:16px;font-weight:500;color:#fff}
.hud-val.red{color:#e63946}
.hud-val.green{color:#4caf50}
.hud-val.yellow{color:#f4c542}
.health-bar{width:120px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:3px}
.health-fill{height:100%;background:#e63946;transition:width .2s;border-radius:4px}
.ammo-bar{width:120px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:3px}
.ammo-fill{height:100%;background:#4caf50;transition:width .2s;border-radius:4px}
.challenge-badge{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(244,197,66,.15);border:1px solid #f4c542;color:#f4c542;padding:6px 18px;border-radius:20px;font-size:12px;z-index:10;pointer-events:none}
.ranking-row{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:0.5px solid #222;width:340px;font-size:14px}
.ranking-pos{color:#888;width:24px;text-align:center}
.ranking-name{flex:1;color:#fff}
.ranking-pts{color:#f4c542;font-weight:500}
.ranking-lvl{color:#888;font-size:12px}
.medal{width:22px;text-align:center}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:1rem 0}
.level-btn{background:#111;border:1px solid #222;color:#888;padding:10px;border-radius:var(--border-radius-md);cursor:pointer;font-size:13px;transition:all .2s;text-align:center}
.level-btn.unlocked{border-color:#e63946;color:#fff;cursor:pointer}
.level-btn.unlocked:hover{background:#e63946;color:#fff}
.level-btn.boss{border-color:#f4c542;color:#f4c542}
.level-btn.boss:hover{background:#f4c542;color:#000}
.level-btn.completed{border-color:#4caf50;color:#4caf50}
.msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);border:1px solid #e63946;padding:16px 32px;border-radius:var(--border-radius-md);font-size:1.1rem;color:#fff;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
.boss-health-bar{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:280px;z-index:10}
.boss-hb-label{font-size:12px;color:#f4c542;margin-bottom:4px;text-align:center}
.boss-hb-track{height:12px;background:#222;border-radius:6px;overflow:hidden;border:1px solid #f4c542}
.boss-hb-fill{height:100%;background:#f4c542;transition:width .1s;border-radius:6px}
</style>

<div id="game">

<div id="screen-login" class="screen">
  <div class="title">DEAD ZONE</div>
  <div class="subtitle">Survivor Shooter</div>
  <input type="text" id="input-name" placeholder="Seu nome de jogador" maxlength="16"/>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" onclick="doLogin()">Entrar</button>
    <button class="btn btn-gray" onclick="showScreen('screen-ranking')">Ranking</button>
  </div>
</div>

<div id="screen-lobby" class="screen hidden">
  <div class="title">DEAD ZONE</div>
  <div id="lobby-welcome" style="color:#aaa;margin-bottom:8px;font-size:14px"></div>
  <div id="lobby-score" style="color:#f4c542;margin-bottom:1.5rem;font-size:1.1rem"></div>
  <div class="level-grid" id="level-grid"></div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn btn-gray" onclick="showScreen('screen-ranking')">Ranking Global</button>
    <button class="btn btn-gray" onclick="showScreen('screen-login')">Trocar Jogador</button>
  </div>
</div>

<div id="screen-ranking" class="screen hidden">
  <div class="title" style="font-size:1.8rem">Ranking Global</div>
  <div style="margin:1rem 0;max-height:340px;overflow-y:auto;width:340px" id="ranking-list"></div>
  <button class="btn btn-gray" onclick="goBack()">Voltar</button>
</div>

<div id="screen-game" class="screen hidden" style="background:#000">
  <canvas id="gc" width="680" height="520"></canvas>
  <div class="hud">
    <div class="hud-stat">
      <span class="hud-label">JOGADOR</span>
      <span class="hud-val" id="hud-name">-</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">FASE</span>
      <span class="hud-val yellow" id="hud-level">1</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">SAÚDE</span>
      <div class="health-bar"><div class="health-fill" id="hud-health"></div></div>
    </div>
    <div class="hud-stat">
      <span class="hud-label">MUNIÇÃO</span>
      <div class="ammo-bar"><div class="ammo-fill" id="hud-ammo"></div></div>
    </div>
    <div class="hud-stat">
      <span class="hud-label">ZUMBIS</span>
      <span class="hud-val red" id="hud-kills">0</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">PONTOS</span>
      <span class="hud-val green" id="hud-score">0</span>
    </div>
  </div>
  <div class="challenge-badge hidden" id="challenge-badge"></div>
  <div class="boss-health-bar hidden" id="boss-hb">
    <div class="boss-hb-label">CHEFÃO — VIDA</div>
    <div class="boss-hb-track"><div class="boss-hb-fill" id="boss-hb-fill"></div></div>
  </div>
  <div class="msg" id="game-msg"></div>
</div>

<div id="screen-gameover" class="screen hidden">
  <div class="title" style="color:#e63946">GAME OVER</div>
  <div id="go-stats" style="color:#aaa;margin:1rem 0;text-align:center;font-size:14px;line-height:1.8"></div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="retryLevel()">Tentar Novamente</button>
    <button class="btn btn-gray" onclick="goLobby()">Lobby</button>
  </div>
</div>

<div id="screen-win" class="screen hidden">
  <div class="title" style="color:#4caf50" id="win-title">FASE CONCLUÍDA!</div>
  <div id="win-stats" style="color:#aaa;margin:1rem 0;text-align:center;font-size:15px;line-height:2"></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" id="btn-next-level" onclick="nextLevel()">Próxima Fase</button>
    <button class="btn btn-gray" onclick="goLobby()">Lobby</button>
  </div>
</div>

</div>

<script>
const LEVELS = 12;
const CHALLENGES = [
  "Matar 5 zumbis em 10s",
  "Sobreviver sem recarregar",
  "Headshot x3 seguidos",
  "Não levar dano por 15s",
  "Matar 2 zumbis com 1 tiro",
  "Limpar onda em 8s",
  "Usar apenas 20% de munição",
  "Matar zumbi correndo",
  "Sobreviver com 10% de vida",
  "Eliminar chefão sem dano"
];

let players = JSON.parse(localStorage.getItem('dz_players')||'[]');
let currentPlayer = null;
let prevScreen = 'screen-lobby';

function savePlayers(){localStorage.setItem('dz_players',JSON.stringify(players))}

function getPlayer(name){return players.find(p=>p.name===name)}
function upsertPlayer(name){
  let p=getPlayer(name);
  if(!p){p={name,score:0,maxLevel:1,completedLevels:[]};players.push(p);}
  savePlayers();return p;
}

function doLogin(){
  const n=document.getElementById('input-name').value.trim();
  if(!n)return;
  currentPlayer=upsertPlayer(n);
  showLobby();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function showLobby(){
  prevScreen='screen-lobby';
  buildLobby();
  showScreen('screen-lobby');
}

function goBack(){showScreen(prevScreen)}

function buildLobby(){
  const p=currentPlayer;
  document.getElementById('lobby-welcome').textContent=`Bem-vindo, ${p.name}`;
  document.getElementById('lobby-score').textContent=`Pontuação Total: ${p.score.toLocaleString()} pts`;
  const grid=document.getElementById('level-grid');
  grid.innerHTML='';
  for(let i=1;i<=LEVELS;i++){
    const btn=document.createElement('button');
    const isBoss=(i===12);
    const isCompleted=p.completedLevels.includes(i);
    const isUnlocked=(i<=p.maxLevel);
    btn.className='level-btn'+(isUnlocked?' unlocked':'')+(isBoss&&isUnlocked?' boss':'')+(isCompleted?' completed':'');
    btn.innerHTML=isBoss?`<div style="font-size:10px;color:inherit">CHEFÃO</div><div style="font-size:18px">12</div>`:`<div style="font-size:10px;color:inherit">FASE</div><div style="font-size:18px">${i}</div>`;
    if(isUnlocked)btn.onclick=()=>startLevel(i);
    grid.appendChild(btn);
  }
}

function buildRanking(){
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  const list=document.getElementById('ranking-list');
  list.innerHTML='';
  if(!sorted.length){list.innerHTML='<div style="color:#555;text-align:center;padding:2rem">Nenhum jogador ainda</div>';return;}
  const medals=['🥇','🥈','🥉'];
  sorted.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='ranking-row';
    row.innerHTML=`<span class="ranking-pos">${medals[i]||'#'+(i+1)}</span><span class="ranking-name">${p.name}</span><span class="ranking-lvl">Nv.${p.maxLevel-1}</span><span class="ranking-pts">${p.score.toLocaleString()}</span>`;
    list.appendChild(row);
  });
}

function showScreen2(id){
  if(id==='screen-ranking')buildRanking();
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
const _orig=showScreen;
window.showScreen=function(id){
  prevScreen=document.querySelector('.screen:not(.hidden)')?.id||'screen-lobby';
  showScreen2(id);
};

// GAME ENGINE
let G={};
let animFrame=null;
let keys={};

function startLevel(lvl){
  if(animFrame)cancelAnimationFrame(animFrame);
  const isBoss=(lvl===12);
  const challengeIdx=(lvl-1)%CHALLENGES.length;
  G={
    lvl,isBoss,
    challenge:CHALLENGES[challengeIdx],
    challengeDone:false,
    player:{x:340,y:420,w:28,h:28,speed:4,health:100,maxHealth:100,ammo:30,maxAmmo:30,dead:false},
    bullets:[],
    zombies:[],
    particles:[],
    boss:isBoss?{x:300,y:80,w:60,h:60,health:300,maxHealth:300,speed:1.2,dir:1,phase:0}:null,
    score:0,kills:0,
    wave:1,maxWaves:isBoss?1:3,waveCleared:false,
    spawnTimer:0,
    spawnInterval:90-lvl*5,
    zombiesPerWave:4+lvl*2,
    zombiesSpawned:0,
    gameRunning:true,
    win:false,
    lastShot:0,
    shootCooldown:10,
    reloading:false,reloadTimer:0,
    challengeTimers:{},
    t:0,
    noHitTimer:0,
    bossPhaseMsg:false,
    msgs:[],
    // challenge tracking
    ch_killsIn10:0,ch_killsIn10Timer:0,
    ch_noReload:true,ch_headshots:0,ch_lastHS:false,
    ch_noHit:0,ch_2in1:false,
    ch_waveStart:0,ch_ammoStart:30,ch_runKill:false,
    ch_lowHealth:false,ch_bossNoDmg:true,
  };
  document.getElementById('hud-name').textContent=currentPlayer.name;
  document.getElementById('hud-level').textContent=lvl;
  const badge=document.getElementById('challenge-badge');
  badge.textContent='Desafio: '+G.challenge;
  badge.classList.remove('hidden');
  document.getElementById('boss-hb').classList.add(isBoss?'':'hidden');
  if(isBoss)document.getElementById('boss-hb').classList.remove('hidden');
  showScreen2('screen-game');
  spawnWave();
  gameLoop();
}

function spawnWave(){
  G.zombiesSpawned=0;
  G.waveCleared=false;
  G.ch_waveStart=G.t;
  G.ch_ammoStart=G.player.ammo;
}

function spawnZombie(){
  if(G.zombiesSpawned>=G.zombiesPerWave)return;
  const side=Math.floor(Math.random()*4);
  let x,y;
  const sp=G.isBoss?2:1+G.lvl*0.15;
  if(side===0){x=Math.random()*680;y=-30}
  else if(side===1){x=710;y=Math.random()*520}
  else if(side===2){x=Math.random()*680;y=550}
  else{x=-30;y=Math.random()*520}
  const isRunner=(G.lvl>=4&&Math.random()<0.25);
  G.zombies.push({x,y,w:24,h:24,health:2+G.lvl,maxHealth:2+G.lvl,speed:(isRunner?2.8:1+G.lvl*0.1)*sp,runner:isRunner,dmg:1+Math.floor(G.lvl/3),dead:false});
  G.zombiesSpawned++;
}

function shootBullet(){
  if(G.player.ammo<=0||G.reloading)return;
  const now=G.t;
  if(now-G.lastShot<G.shootCooldown)return;
  G.lastShot=now;
  const tx=mouseX,ty=mouseY;
  const px=G.player.x+14,py=G.player.y+14;
  const dx=tx-px,dy=ty-py;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=12;
  G.bullets.push({x:px,y:py,vx:dx/len*spd,vy:dy/len*spd,life:60,headshot:false});
  G.player.ammo--;
  if(G.player.ammo===0&&!G.reloading)startReload();
}

function startReload(){
  if(G.reloading||G.player.ammo===G.player.maxAmmo)return;
  G.reloading=true;G.reloadTimer=90;
  showMsg('Recarregando...',1200);
  if(G.challenge===CHALLENGES[1])G.ch_noReload=false;
}

function showMsg(txt,dur=1500){
  const el=document.getElementById('game-msg');
  el.textContent=txt;el.style.opacity=1;
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity=0},dur);
}

let mouseX=340,mouseY=260;
let shootHeld=false;

const gc=document.getElementById('gc');
gc.addEventListener('mousemove',e=>{const r=gc.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top});
gc.addEventListener('mousedown',e=>{if(e.button===0)shootHeld=true});
gc.addEventListener('mouseup',e=>{if(e.button===0)shootHeld=false});
gc.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='r')startReload();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function gameLoop(){
  if(!G.gameRunning){return;}
  animFrame=requestAnimationFrame(gameLoop);
  G.t++;
  const ctx=gc.getContext('2d');
  updateGame(ctx);
  renderGame(ctx);
}

function updateGame(ctx){
  const p=G.player;
  // move
  if(keys['arrowleft']||keys['a'])p.x-=p.speed;
  if(keys['arrowright']||keys['d'])p.x+=p.speed;
  if(keys['arrowup']||keys['w'])p.y-=p.speed;
  if(keys['arrowdown']||keys['s'])p.y+=p.speed;
  p.x=Math.max(0,Math.min(652,p.x));
  p.y=Math.max(50,Math.min(492,p.y));

  // shoot
  if(shootHeld)shootBullet();

  // reload
  if(G.reloading){
    G.reloadTimer--;
    if(G.reloadTimer<=0){G.reloading=false;p.ammo=p.maxAmmo;}
  }

  // bullets
  G.bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});
  G.bullets=G.bullets.filter(b=>b.life>0);

  // spawn
  if(G.gameRunning&&!G.waveCleared){
    G.spawnTimer++;
    if(G.spawnTimer>G.spawnInterval&&G.zombiesSpawned<G.zombiesPerWave){
      spawnZombie();G.spawnTimer=0;
    }
  }

  // zombie move & hit player
  G.noHitTimer++;
  G.zombies.forEach(z=>{
    if(z.dead)return;
    const dx=p.x-z.x,dy=p.y-z.y,len=Math.sqrt(dx*dx+dy*dy)||1;
    z.x+=dx/len*z.speed;z.y+=dy/len*z.speed;
    if(rect(z,p)){
      p.health-=z.dmg*0.4;
      G.noHitTimer=0;
      G.ch_bossNoDmg=false;
      if(G.challenge===CHALLENGES[3]){G.ch_noHit=0;}
    }
  });

  // no-hit challenge
  if(G.challenge===CHALLENGES[3]&&G.noHitTimer>=15*60&&!G.challengeDone){
    G.challengeDone=true;completeChallenge();
  }

  // bullet-zombie collision
  G.bullets.forEach(b=>{
    G.zombies.forEach(z=>{
      if(z.dead||b.life<=0)return;
      if(rect(b,z)){
        const hs=(b.vy<0&&b.y<z.y+8);
        b.life=0;
        z.health-=hs?2:1;
        if(hs){G.ch_headshots++;if(G.ch_headshots>=3&&!G.challengeDone&&G.challenge===CHALLENGES[2]){G.challengeDone=true;completeChallenge();}}
        for(let i=0;i<6;i++)G.particles.push({x:z.x+12,y:z.y+12,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:20,color:'#e63946'});
        if(z.health<=0){
          z.dead=true;G.kills++;G.score+=hs?150:100;
          checkChallengeKill(z);
        }
      }
    });
    // boss bullet hit
    if(G.isBoss&&G.boss&&b.life>0){
      const bs=G.boss;
      if(rect(b,bs)){b.life=0;bs.health-=3;G.score+=50;for(let i=0;i<8;i++)G.particles.push({x:bs.x+30,y:bs.y+30,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25,color:'#f4c542'});
        if(bs.health<=0){
          winLevel();return;
        }
        if(bs.health<bs.maxHealth*.5&&!G.bossPhaseMsg){G.bossPhaseMsg=true;showMsg('Chefão enraivecido!',2000);bs.speed*=1.5;}
        document.getElementById('boss-hb-fill').style.width=Math.max(0,bs.health/bs.maxHealth*100)+'%';
      }
    }
  });

  // boss movement
  if(G.isBoss&&G.boss&&!G.win){
    const bs=G.boss;
    bs.x+=bs.speed*bs.dir;
    if(bs.x>620||bs.x<0)bs.dir*=-1;
    bs.phase+=0.03;
    bs.y=80+Math.sin(bs.phase)*40;
    // boss shoots projectile occasionally
    if(G.t%120===0){
      const dx=p.x-bs.x,dy=p.y-bs.y,len=Math.sqrt(dx*dx+dy*dy)||1;
      G.bullets.push({x:bs.x+30,y:bs.y+30,vx:dx/len*4,vy:dy/len*4,life:120,boss:true,color:'#f4c542'});
    }
  }

  // boss bullets hit player
  G.bullets.forEach(b=>{
    if(!b.boss)return;
    if(rect(b,p)){b.life=0;p.health-=8;G.noHitTimer=0;}
  });

  G.zombies=G.zombies.filter(z=>!z.dead);
  G.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;});
  G.particles=G.particles.filter(pt=>pt.life>0);

  // wave clear
  if(!G.waveCleared&&G.zombiesSpawned>=G.zombiesPerWave&&G.zombies.length===0){
    G.waveCleared=true;
    if(G.wave<G.maxWaves){
      G.wave++;G.score+=500;
      showMsg('Onda '+G.wave+'! +500pts',1500);
      setTimeout(()=>{spawnWave();},1500);
    } else if(!G.isBoss){
      winLevel();
    }
  }

  // challenge timing checks
  if(G.challenge===CHALLENGES[6]&&G.waveCleared&&!G.challengeDone){
    const used=G.ch_ammoStart-p.ammo;
    if(used<=G.ch_ammoStart*.2){G.challengeDone=true;completeChallenge();}
  }
  if(G.challenge===CHALLENGES[9]&&G.isBoss&&G.boss&&G.boss.health<=0&&G.ch_bossNoDmg&&!G.challengeDone){
    G.challengeDone=true;completeChallenge();
  }

  // low health challenge
  if(G.challenge===CHALLENGES[8]&&p.health<=10&&!G.ch_lowHealth){G.ch_lowHealth=true;}
  if(G.challenge===CHALLENGES[8]&&G.ch_lowHealth&&G.waveCleared&&!G.challengeDone){G.challengeDone=true;completeChallenge();}

  // hud update
  document.getElementById('hud-health').style.width=(p.health/p.maxHealth*100)+'%';
  document.getElementById('hud-ammo').style.width=(p.ammo/p.maxAmmo*100)+'%';
  document.getElementById('hud-kills').textContent=G.kills;
  document.getElementById('hud-score').textContent=G.score;

  if(p.health<=0&&!p.dead){p.dead=true;G.gameRunning=false;setTimeout(gameOver,500);}
}

function checkChallengeKill(z){
  const ch=G.challenge;
  const idx=CHALLENGES.indexOf(ch);
  if(idx===0){G.ch_killsIn10++;G.ch_killsIn10Timer=G.t;if(G.ch_killsIn10>=5&&!G.challengeDone){G.challengeDone=true;completeChallenge();}}
  if(idx===4){// 2 with 1 shot: hard to track exactly, reward on fast double kill
  }
  if(idx===5){// wave in 8s
    const elapsed=(G.t-G.ch_waveStart)/60;
    if(G.zombies.length===0&&G.zombiesSpawned>=G.zombiesPerWave&&elapsed<=8&&!G.challengeDone){G.challengeDone=true;completeChallenge();}
  }
  if(idx===7&&z.runner&&!G.challengeDone){G.challengeDone=true;completeChallenge();}
}

function completeChallenge(){
  G.score+=1000;
  showMsg('DESAFIO CONCLUÍDO! +1000pts',2500);
}

function winLevel(){
  if(G.win)return;
  G.win=true;G.gameRunning=false;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  const bonus=G.isBoss?3000:500;
  G.score+=bonus;
  currentPlayer.score+=G.score;
  if(!currentPlayer.completedLevels.includes(G.lvl))currentPlayer.completedLevels.push(G.lvl);
  if(G.lvl>=currentPlayer.maxLevel&&G.lvl<LEVELS)currentPlayer.maxLevel=G.lvl+1;
  savePlayers();
  const wt=document.getElementById('win-title');
  wt.textContent=G.isBoss?'CHEFÃO DERROTADO! VOCÊ VENCEU!':'FASE CONCLUÍDA!';
  wt.style.color=G.isBoss?'#f4c542':'#4caf50';
  document.getElementById('win-stats').innerHTML=
    `Fase: ${G.lvl} ${G.isBoss?'🏆':''}<br>Zumbis eliminados: ${G.kills}<br>Pontos da fase: ${G.score.toLocaleString()}<br>Total acumulado: ${currentPlayer.score.toLocaleString()}<br>${G.challengeDone?'Desafio concluído! +1000':''}`;
  document.getElementById('btn-next-level').style.display=G.lvl>=LEVELS?'none':'';
  showScreen2('screen-win');
}

function gameOver(){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  currentPlayer.score+=Math.floor(G.score*.5);
  savePlayers();
  document.getElementById('go-stats').innerHTML=
    `Fase ${G.lvl} — ${G.kills} zumbis<br>Pontos parciais: ${Math.floor(G.score*.5).toLocaleString()}<br>Total: ${currentPlayer.score.toLocaleString()}`;
  showScreen2('screen-gameover');
}

window.retryLevel=function(){startLevel(G.lvl);}
window.nextLevel=function(){if(G.lvl<LEVELS)startLevel(G.lvl+1);}
window.goLobby=function(){if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}showLobby();}

function renderGame(ctx){
  const W=680,H=520;
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // particles
  G.particles.forEach(pt=>{ctx.globalAlpha=pt.life/20;ctx.fillStyle=pt.color||'#e63946';ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  // bullets
  G.bullets.forEach(b=>{
    ctx.fillStyle=b.boss?'#f4c542':'#ffe066';
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
  });
  // zombies
  G.zombies.forEach(z=>{
    ctx.fillStyle=z.runner?'#8bc34a':'#6ea832';
    ctx.fillRect(z.x,z.y,z.w,z.h);
    // zombie face
    ctx.fillStyle='#fff';ctx.fillRect(z.x+4,z.y+5,5,5);ctx.fillRect(z.x+15,z.y+5,5,5);
    ctx.fillStyle='#000';ctx.fillRect(z.x+6,z.y+7,3,3);ctx.fillRect(z.x+17,z.y+7,3,3);
    ctx.fillStyle='#c0392b';ctx.fillRect(z.x+5,z.y+16,14,3);
    // health
    ctx.fillStyle='#333';ctx.fillRect(z.x,z.y-6,z.w,3);
    ctx.fillStyle='#4caf50';ctx.fillRect(z.x,z.y-6,z.w*(z.health/z.maxHealth),3);
  });
  // boss
  if(G.isBoss&&G.boss){
    const bs=G.boss;
    ctx.fillStyle='#b8860b';ctx.fillRect(bs.x,bs.y,bs.w,bs.h);
    ctx.fillStyle='#f4c542';ctx.fillRect(bs.x+4,bs.y+4,bs.w-8,bs.h-8);
    ctx.fillStyle='#000';ctx.fillText('CHEFÃO',bs.x+6,bs.y+35);
    // crown
    ctx.fillStyle='#f4c542';
    ctx.beginPath();ctx.moveTo(bs.x+10,bs.y-5);ctx.lineTo(bs.x+20,bs.y-15);ctx.lineTo(bs.x+30,bs.y-5);ctx.lineTo(bs.x+40,bs.y-15);ctx.lineTo(bs.x+50,bs.y-5);ctx.lineTo(bs.x+50,bs.y);ctx.lineTo(bs.x+10,bs.y);ctx.closePath();ctx.fill();
  }
  // player
  const p=G.player;
  ctx.fillStyle='#2196f3';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#fff';ctx.fillRect(p.x+5,p.y+5,8,8);ctx.fillRect(p.x+15,p.y+5,8,8);
  ctx.fillStyle='#111';ctx.fillRect(p.x+7,p.y+7,4,4);ctx.fillRect(p.x+17,p.y+7,4,4);
  // gun aim line
  const px=p.x+14,py=p.y+14;
  const dx=mouseX-px,dy=mouseY-py,len=Math.sqrt(dx*dx+dy*dy)||1;
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+dx/len*30,py+dy/len*30);ctx.stroke();
  // crosshair
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(mouseX-10,mouseY);ctx.lineTo(mouseX+10,mouseY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mouseX,mouseY-10);ctx.lineTo(mouseX,mouseY+10);ctx.stroke();
  ctx.beginPath();ctx.arc(mouseX,mouseY,6,0,Math.PI*2);ctx.stroke();
  // wave info
  if(!G.isBoss){
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';
    ctx.fillText(`Onda ${G.wave}/${G.maxWaves}`,10,H-10);
  }
  ctx.font='12px sans-serif';
}

// init
showScreen('screen-login');
</script>
